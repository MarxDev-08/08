<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SPA Redirect</title>
  <script>
    (function(l){
      var keep = 1; // keep '/08'
      var p = l.pathname.slice(1).split('/');
      var url = l.protocol + '//' + l.host + '/' +
        p.slice(0, keep).join('/') + '/index.html?/' +
        p.slice(keep).join('/');
      if (l.search) url += l.search;
      if (l.hash)   url += l.hash;
      l.replace(url);
    })(window.location);
  </script>
</head>
<body></body>
</html>
